Eksperimen kami menggunakan 12.000 jam data EEG dan membandingkannya dengan aktivasi internal transformer. Hasilnya mengejutkan: ada korelasi 0.71 pada lapisan tengah.`,wordCount:412,isPremium:!1},{id:"c1-2",title:"Bab 2: Arsitektur yang Mengingat",content:"Memori bukan penyimpanan. Memori adalah rekonstruksi. Inilah kesalahan fundamental banyak arsitektur AI saat ini...",wordCount:380,isPremium:!1}]},{id:"a2",title:"Kota di Atas Hujan",author:"Havin Al Farizi",authorEmail:"havin@litera.id",category:"fiksi",genre:"novel",excerpt:"Seorang arsiparis menemukan bahwa setiap hujan di Jakarta menyimpan satu ingatan yang hilang.",content:"...",cover:"◑",isPremium:!0,views:8923,likes:621,createdAt:"2024-12-12",chapters:[{id:"c2-1",title:"Prolog: Arsip Basah",content:`Hujan pertama Desember selalu membawa bau kertas lama. Di lantai 3 Perpustakaan Nasional, Maya membuka kotak kayu yang tidak tercatat di katalog. Di dalamnya: 44 kaset mini, masing-masing berlabel tanggal hujan. 12 Des 1998. 21 Feb 2003. 7 Sep 2018. Ia memutar yang pertama. Suara seorang anak: "Ibu bilang kalau hujan, kita harus ingat." Maya menutup mata. Di luar, hujan baru saja turun.

Maya bukan orang yang percaya hal mistis. Ia arsiparis. Tugasnya adalah fakta. Tapi kaset itu... ada suara ayahnya di sana. Ayah yang hilang tahun 1999.`,wordCount:520,isPremium:!1},{id:"c2-2",title:"Bab 1: Jalanan yang Lupa",content:"Pagi setelah hujan, peta Jakarta berubah sedikit. Bukan secara fisik, tapi secara ingatan. Orang-orang melupakan jalan kecil di Kebayoran...",wordCount:610,isPremium:!0},{id:"c2-3",title:"Bab 2: Pemulung Memori",content:"Di bawah jembatan Penjaringan, ada pasar yang hanya buka saat hujan deras...",wordCount:590,isPremium:!0}]},{id:"a3",title:"Sejarah Kopi Toraja dalam Naskah Lontara",author:"Andi Mattalatta",authorEmail:"andi@litera.id",category:"sejarah",genre:"jurnal",excerpt:"Analisis filologi 3 naskah Lontara abad 19 tentang perdagangan kopi.",content:"...",cover:"◒",isPremium:!1,views:1210,likes:94,createdAt:"2024-11-28",chapters:[{id:"c3-1",title:"Pendahuluan Metodologi",content:'Penelitian ini menggunakan metode filologi deskriptif komparatif. Tiga naskah Lontara dikodeks: LNT-01, LNT-19, dan LNT-44. Semua menyebut "kawa" bukan "kopi", menunjukkan pengaruh bahasa Arab melalui pedagang Bugis...',wordCount:350,isPremium:!1}]},{id:"a4",title:"Cara Kerja Manusia: Sebuah Cerpen Kuantum",author:"Saraswati Devi",authorEmail:"saras@litera.id",category:"fiksi",genre:"cerpen",excerpt:"Seorang teknisi lift menemukan bahwa liftnya berhenti di lantai yang tidak ada.",content:"...",cover:"◓",isPremium:!1,views:4533,likes:302,createdAt:"2024-12-08",chapters:[{id:"c4-1",title:"Cerpen Lengkap",content:`Lift gedung 8 lantai itu hanya punya tombol 1-8. Tapi kemarin, tombol 9 menyala sendiri. Rudi menekan. Pintu terbuka ke sebuah koridor dengan karpet merah yang tidak pernah ia pasang. Di ujung, seorang wanita tua menunggu. "Akhirnya kamu datang," katanya. "Saya menunggu dari 1987."
